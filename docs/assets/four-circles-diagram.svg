<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Four-Circles Pythagorean Geometric Model (a=4, b=3, c=5, r=1)</title>
  <desc>Canonical coordinate construction showing right triangle OAB, exterior squares Qa, Qb, Qc, square-inscribed circles Ka, Kb, Kc, and triangle incircle Ki.</desc>

  <rect width="600" height="500" fill="#f8fafc" rx="12" />

  <!-- Subtle Cartesian grid (1 unit = 40px, origin O at (220, 330)) -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="60" y1="50" x2="60" y2="460" />
    <line x1="100" y1="50" x2="100" y2="460" />
    <line x1="140" y1="50" x2="140" y2="460" />
    <line x1="180" y1="50" x2="180" y2="460" />
    <line x1="260" y1="50" x2="260" y2="460" />
    <line x1="300" y1="50" x2="300" y2="460" />
    <line x1="340" y1="50" x2="340" y2="460" />
    <line x1="380" y1="50" x2="380" y2="460" />
    <line x1="420" y1="50" x2="420" y2="460" />
    <line x1="460" y1="50" x2="460" y2="460" />
    <line x1="500" y1="50" x2="500" y2="460" />

    <line x1="40" y1="50" x2="520" y2="50" />
    <line x1="40" y1="90" x2="520" y2="90" />
    <line x1="40" y1="130" x2="520" y2="130" />
    <line x1="40" y1="170" x2="520" y2="170" />
    <line x1="40" y1="210" x2="520" y2="210" />
    <line x1="40" y1="250" x2="520" y2="250" />
    <line x1="40" y1="290" x2="520" y2="290" />
    <line x1="40" y1="370" x2="520" y2="370" />
    <line x1="40" y1="410" x2="520" y2="410" />
    <line x1="40" y1="450" x2="520" y2="450" />
  </g>

  <!-- Coordinate Axes -->
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="36" y1="330" x2="536" y2="330" />
    <line x1="220" y1="36" x2="220" y2="472" />
  </g>
  <text x="542" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">+X</text>
  <text x="225" y="42" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#64748b">+Y</text>

  <!-- Square Qa on OA (a = 4) -->
  <rect x="60" y="170" width="160" height="160" fill="#dbeafe" fill-opacity="0.35" stroke="#2563eb" stroke-width="1.75" />
  <circle cx="140" cy="250" r="80" fill="#3b82f6" fill-opacity="0.18" stroke="#2563eb" stroke-width="2.2" />
  <circle cx="140" cy="250" r="3" fill="#2563eb" />
  <line x1="140" y1="250" x2="220" y2="250" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 3" />

  <!-- Square Qb on OB (b = 3) -->
  <rect x="220" y="330" width="120" height="120" fill="#d1fae5" fill-opacity="0.35" stroke="#059669" stroke-width="1.75" />
  <circle cx="280" cy="390" r="60" fill="#10b981" fill-opacity="0.18" stroke="#059669" stroke-width="2.2" />
  <circle cx="280" cy="390" r="3" fill="#059669" />
  <line x1="280" y1="390" x2="280" y2="330" stroke="#059669" stroke-width="1.4" stroke-dasharray="4 3" />

  <!-- Square Qc on AB (c = 5) -->
  <polygon points="220,170 340,330 500,210 380,50" fill="#ffe4e6" fill-opacity="0.35" stroke="#e11d48" stroke-width="1.75" />
  <circle cx="360" cy="190" r="100" fill="#f43f5e" fill-opacity="0.16" stroke="#e11d48" stroke-width="2.2" />
  <circle cx="360" cy="190" r="3" fill="#e11d48" />
  <line x1="360" y1="190" x2="280" y2="250" stroke="#e11d48" stroke-width="1.4" stroke-dasharray="4 3" />

  <!-- Right Triangle OAB -->
  <polygon points="220,330 220,170 340,330" fill="#eef2ff" fill-opacity="0.65" stroke="#312e81" stroke-width="2.4" />
  <!-- Right angle mark at O -->
  <polyline points="220,314 236,314 236,330" fill="none" stroke="#312e81" stroke-width="1.5" />

  <!-- Fourth Circle: Incircle Ki inside OAB (r = 1) -->
  <circle cx="260" cy="290" r="40" fill="#f59e0b" fill-opacity="0.25" stroke="#d97706" stroke-width="2.4" />
  <circle cx="260" cy="290" r="3.2" fill="#b45309" />
  <!-- Tangency radii -->
  <line x1="260" y1="290" x2="220" y2="290" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 2" />
  <line x1="260" y1="290" x2="260" y2="330" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 2" />
  <line x1="260" y1="290" x2="292" y2="266" stroke="#b45309" stroke-width="1.2" stroke-dasharray="3 2" />
  <circle cx="220" cy="290" r="2.5" fill="#b45309" />
  <circle cx="260" cy="330" r="2.5" fill="#b45309" />
  <circle cx="292" cy="266" r="2.5" fill="#b45309" />

  <!-- Vertices -->
  <circle cx="220" cy="330" r="4" fill="#1e293b" />
  <circle cx="220" cy="170" r="4.5" fill="#4f46e5" />
  <circle cx="340" cy="330" r="4.5" fill="#4f46e5" />

  <!-- Labels -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="600">
    <text x="196" y="346" font-size="12" fill="#1e293b">O(0,0)</text>
    <text x="172" y="162" font-size="12" fill="#312e81">A(0,a)</text>
    <text x="346" y="346" font-size="12" fill="#312e81">B(b,0)</text>

    <text x="68" y="190" font-size="13" fill="#1d4ed8">Qa</text>
    <text x="128" y="242" font-size="14" fill="#1e40af">Ka</text>
    <text x="158" y="266" font-family="ui-monospace, monospace" font-size="11" fill="#1d4ed8">Ra=a/2</text>

    <text x="228" y="442" font-size="13" fill="#047857">Qb</text>
    <text x="270" y="408" font-size="14" fill="#065f46">Kb</text>
    <text x="284" y="366" font-family="ui-monospace, monospace" font-size="11" fill="#047857">Rb=b/2</text>

    <text x="386" y="70" font-size="13" fill="#be123c">Qc</text>
    <text x="355" y="180" font-size="14" fill="#9f1239">Kc</text>
    <text x="305" y="218" font-family="ui-monospace, monospace" font-size="11" fill="#be123c">Rc=c/2</text>

    <text x="249" y="284" font-size="13" fill="#92400e">Ki</text>
    <text x="266" y="294" font-family="ui-monospace, monospace" font-size="11" fill="#92400e">I(r,r)</text>
  </g>

  <!-- Central Identity Banner -->
  <rect x="20" y="16" width="320" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="32" y="37" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">
    Central Identity (a=4, b=3, c=5, r=1)
  </text>
  <text x="32" y="59" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#334155">
    √Ka + √Kb = √Kc + √Ki  (r = (a+b-c)/2)
  </text>
</svg>
