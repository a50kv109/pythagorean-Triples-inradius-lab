        <text x="96" y="257" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#1d4ed8">φ_A = 105° (29.2%)</text>
        <text x="96" y="271" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#047857">φ_B = 165° (45.8%)</text>
        <text x="96" y="285" text-anchor="middle" font-size="9.5" font-family="monospace" fill="#b45309">φ_C = 90° (25.0%)</text>
