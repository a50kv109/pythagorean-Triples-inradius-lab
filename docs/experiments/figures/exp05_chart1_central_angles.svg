  <text x="50" y="66.0" text-anchor="end" font-size="10" fill="#475569" font-family="monospace">180°</text><line x1="58.0" y1="62" x2="58.0" y2="314" stroke="#f1f5f9" stroke-width="1"  />
  <text x="58.0" y="330" text-anchor="middle" font-size="10" fill="#475569" font-family="monospace">0°</text><line x1="157.0" y1="62" x2="157.0" y2="314" stroke="#f1f5f9" stroke-width="1"  />
  <text x="157.0" y="330" text-anchor="middle" font-size="10" fill="#475569" font-family="monospace">15°</text><line x1="256.0" y1="62" x2="256.0" y2="314" stroke="#f1f5f9" stroke-width="1"  />
