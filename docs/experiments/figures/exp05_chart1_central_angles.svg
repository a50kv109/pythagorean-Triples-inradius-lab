    <line x1="82" y1="84" x2="102" y2="84" stroke="#2563eb" stroke-width="2.5" />
    <text x="108" y="88" font-size="10" fill="#0f172a">φ_A = 180° − A = 90° + α</text>
    <line x1="82" y1="102" x2="102" y2="102" stroke="#059669" stroke-width="2.5" />
    <text x="108" y="106" font-size="10" fill="#0f172a">φ_B = 180° − B = 180° − α</text>
    <line x1="82" y1="120" x2="102" y2="120" stroke="#d97706" stroke-width="2.5" />
    <text x="108" y="124" font-size="10" fill="#0f172a">φ_C = 180° − C = 90° (const)</text>
