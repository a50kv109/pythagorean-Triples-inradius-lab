<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="680" height="360" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #ffffff;">
  <rect x="0" y="0" width="680" height="360" fill="#ffffff" rx="8" />
  <text x="58" y="28" font-size="14" font-weight="700" fill="#0f172a">График 1. Центральные углы трёх дуг вписанной окружности φ_A, φ_B, φ_C от α</text>
  <text x="58" y="45" font-size="11" fill="#475569">φ_A = 90° + α, φ_B = 180° − α, φ_C ≡ 90° (инвариантны к масштабу r = 1, 2, 3)</text>
