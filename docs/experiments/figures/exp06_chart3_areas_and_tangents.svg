  <text x="58" y="28" font-size="14" font-weight="700" fill="#0f172a">График 3. Площади трёх малых треугольников S_a, S_b, S_c (при r = 1, α ∈ [10°, 80°])</text>
  <text x="58" y="45" font-size="11" fill="#475569">S_a = ½ar (против A), S_b = ½br (против B), S_c = ½cr; везде S_a² + S_b² = S_c² и S_a + S_b − S_c = 1</text>
